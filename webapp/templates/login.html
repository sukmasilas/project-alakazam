<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alakazam — Log in</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="brand" style="padding:0 0 18px 0;border:none;">Alakazam<span>.</span></div>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="pe-field" style="margin-bottom:12px;">
        <label>Username</label>
        <input type="text" name="username" autofocus required style="width:100%;">
      </div>
      <div class="pe-field" style="margin-bottom:16px;">
        <label>Password</label>
        <input type="password" name="password" required style="width:100%;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
